<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hold Minigolf</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510; /* Sötét űr szín */
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border-radius: 10px;
            border: 1px solid #444;
        }
        #ui h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            color: #00ffcc;
        }
        #ui p {
            margin: 5px 0;
            font-size: 18px;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border-radius: 10px;
            border: 1px solid #444;
        }
        #instructions h3 {
            margin: 0 0 10px 0;
            color: #ffcc00;
        }
        #instructions ul {
            margin: 0;
            padding-left: 20px;
        }
        #instructions li {
            margin-bottom: 5px;
        }
        #power-meter {
            color: #ff3366;
            font-weight: bold;
        }
    </style>
    <!-- Three.js és OrbitControls beimportálása -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui">
        <h1>Hold Minigolf</h1>
        <p>Lövések száma: <span id="strokes">0</span></p>
        <p>Erősség: <span id="power-meter">50%</span></p>
    </div>

    <div id="instructions">
        <h3>Irányítás</h3>
        <ul>
            <li><b>Kamera:</b> Egér bal gomb (forgatás), görgő (zoom)</li>
            <li><b>Célzás:</b> Bal / Jobb nyíl</li>
            <li><b>Erősség:</b> Fel / Le nyíl</li>
            <li><b>Lövés:</b> Enter</li>
        </ul>
    </div>

    <script>
        // --- 1. ALAPOK BEÁLLÍTÁSA ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Kamera pozíciója és irányítása
        camera.position.set(15, 15, 15);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enablePan = false;
        controls.minDistance = 12;
        controls.maxDistance = 40;

        // Fények
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(20, 20, 10);
        scene.add(directionalLight);

        // --- 2. JÁTÉK ELEMEINEK LÉTREHOZÁSA ---
        const moonRadius = 10;
        
        // Hold (Gömb)
        const moonGeo = new THREE.SphereGeometry(moonRadius, 64, 64);
        const moonMat = new THREE.MeshPhongMaterial({ color: 0xcccccc, wireframe: false });
        const moon = new THREE.Mesh(moonGeo, moonMat);
        scene.add(moon);

        // Labda
        const ballRadius = 0.3;
        const ballGeo = new THREE.SphereGeometry(ballRadius, 16, 16);
        const ballMat = new THREE.MeshPhongMaterial({ color: 0x00ffcc });
        const ball = new THREE.Mesh(ballGeo, ballMat);
        scene.add(ball);

        // Lyuk (Sötét kör a felszínen a "nyugati" póluson)
        const holeRadius = 0.8;
        const holeGeo = new THREE.CircleGeometry(holeRadius, 32);
        const holeMat = new THREE.MeshBasicMaterial({ color: 0x111111, side: THREE.DoubleSide });
        const hole = new THREE.Mesh(holeGeo, holeMat);
        
        // A lyuk pozíciója (negyed kerületre az Egyenlítőtől a sarkkör felé)
        const holePos = new THREE.Vector3(0, moonRadius, 0);
        hole.position.copy(holePos).multiplyScalar(1.001); // Kicsit kiemeljük, hogy ne villogjon
        hole.lookAt(0, 0, 0); // Felszínre simul
        scene.add(hole);

        // Zászló (A lyuk mellé/közepébe)
        const poleGeo = new THREE.CylinderGeometry(0.05, 0.05, 3);
        const poleMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const pole = new THREE.Mesh(poleGeo, poleMat);
        pole.position.set(0, moonRadius + 1.5, 0);
        scene.add(pole);

        const flagGeo = new THREE.PlaneGeometry(1.2, 0.8);
        const flagMat = new THREE.MeshBasicMaterial({ color: 0xff3366, side: THREE.DoubleSide });
        const flag = new THREE.Mesh(flagGeo, flagMat);
        flag.position.set(0.6, moonRadius + 2.5, 0);
        scene.add(flag);

        // --- 3. JÁTÉK LOGIKA ÉS VÁLTOZÓK ---
        let strokes = 0;
        let isMoving = false;
        let power = 0.5; // 0.1-től 1.0-ig
        let velocity = new THREE.Vector3();
        
        // Kezdőpont (Egyenlítőn)
        const startPos = new THREE.Vector3(moonRadius, 0, 0);
        ball.position.copy(startPos);
        
        // Célzási irány (kezdetben felfelé mutat az Y tengely mentén)
        let aimDirection = new THREE.Vector3(0, 1, 0);

        // Segédnyíl a célzáshoz
        const arrowHelper = new THREE.ArrowHelper(aimDirection, ball.position, 2, 0xffcc00, 0.5, 0.4);
        scene.add(arrowHelper);

        // Nyíl frissítése
        function updateArrow() {
            if (isMoving) return;
            const normal = ball.position.clone().normalize();
            arrowHelper.position.copy(ball.position).add(normal.multiplyScalar(ballRadius));
            arrowHelper.setDirection(aimDirection);
            arrowHelper.setLength(power * 5); // Láthatóság miatt felszorozzuk
            document.getElementById('power-meter').innerText = Math.round(power * 100) + '%';
        }
        updateArrow();

        // --- 4. IRÁNYÍTÁS ---
        window.addEventListener('keydown', (e) => {
            if (isMoving) return;

            const normal = ball.position.clone().normalize();

            switch(e.key) {
                case 'ArrowLeft':
                    // Forgatás a felszíni normális körül
                    aimDirection.applyAxisAngle(normal, 0.1);
                    updateArrow();
                    break;
                case 'ArrowRight':
                    aimDirection.applyAxisAngle(normal, -0.1);
                    updateArrow();
                    break;
                case 'ArrowUp':
                    power = Math.min(power + 0.05, 1.0);
                    updateArrow();
                    break;
                case 'ArrowDown':
                    power = Math.max(power - 0.05, 0.1);
                    updateArrow();
                    break;
                case 'Enter':
                    // Lövés! Sebesség beállítása az irány és az erő alapján
                    velocity.copy(aimDirection).multiplyScalar(power * 0.4);
                    isMoving = true;
                    strokes++;
                    document.getElementById('strokes').innerText = strokes;
                    arrowHelper.visible = false; // Elrejtjük a nyilat mozgás közben
                    break;
            }
        });

        // Ablak átméretezés kezelése
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 5. FŐ CIKLUS (ANIMÁCIÓ ÉS FIZIKA) ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            if (isMoving) {
                // Pozíció módosítása a sebességgel
                ball.position.add(velocity);

                // Gömb felületen tartás (visszahúzzuk a pozíciót a Hold sugarára)
                ball.position.normalize().multiplyScalar(moonRadius);

                // A sebességvektort is a felszínhez kell igazítani (érintő irányba)
                const normal = ball.position.clone().normalize();
                velocity.projectOnPlane(normal);

                // Súrlódás (lassulás)
                velocity.multiplyScalar(0.98);

                // Megállás
                if (velocity.length() < 0.005) {
                    isMoving = false;
                    velocity.set(0, 0, 0);
                    
                    // Célzási irány frissítése az új pozíció normálisa alapján
                    aimDirection.projectOnPlane(normal).normalize();
                    
                    arrowHelper.visible = true;
                    updateArrow();
                }

                // Lyukba esés vizsgálata (Távolság a lyuk középpontjától)
                if (ball.position.distanceTo(holePos) < holeRadius) {
                    isMoving = false;
                    velocity.set(0, 0, 0);
                    
                    // Rövid késleltetés, hogy a renderelés befejeződjön a riasztás előtt
                    setTimeout(() => {
                        alert(`Gratulálok! Célba értél a Holdon!\nLövések száma: ${strokes}`);
                        
                        // Játék visszaállítása
                        ball.position.copy(startPos);
                        strokes = 0;
                        power = 0.5;
                        aimDirection.set(0, 1, 0);
                        document.getElementById('strokes').innerText = strokes;
                        arrowHelper.visible = true;
                        updateArrow();
                    }, 50);
                }
            }

            // A zászló mindig nézzen a kamera felé, hogy jól mutasson (billboard hatás)
            flag.lookAt(camera.position);

            renderer.render(scene, camera);
        }

        // Indulhat a móka!
        animate();
    </script>
</body>
</html>
